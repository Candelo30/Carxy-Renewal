<main
  class="editor-layout page-with-header"
  [class.presentation-mode]="presentationMode"
  [class.panel-collapsed]="!modelEditorOpen"
>
  <!-- Header unificado -->
  <app-shell-header
    [showSearch]="false"
    [showNav]="false"
    [showPublish]="true"
    [showPresentation]="true"
    (publishClick)="onPublishClick()"
    (presentationChange)="onPresentationChange($event)"
  ></app-shell-header>

  <aside class="editor-panel-area">
    <app-model-editor />
  </aside>

  <section class="viewer-area">
    <app-model-viewer />
    <button
      type="button"
      class="panel-toggle"
      [attr.aria-expanded]="modelEditorOpen"
      [attr.aria-label]="modelEditorOpen
        ? ('Contraer editor de modelo' | translate)
        : ('Abrir editor de modelo' | translate)"
      [title]="modelEditorOpen
        ? ('Contraer editor' | translate)
        : ('Abrir editor' | translate)"
      (click)="modelEditorOpen = !modelEditorOpen"
    >
      <span aria-hidden="true">{{ modelEditorOpen ? '◀' : '▶' }}</span>
      <span class="toggle-label">
        {{ modelEditorOpen
          ? ('Ocultar panel' | translate)
          : ('Editor' | translate) }}
      </span>
    </button>
  </section>
</main>

<!-- Onboarding tutorial -->
@if (onboardingOpen) {
  <app-onboarding
    [step]="onboardingStep"
    (onComplete)="onOnboardingComplete()"
  ></app-onboarding>
}

@if (publishModalOpen) {
  <app-publish-modal (closed)="publishModalOpen = false" />
}
